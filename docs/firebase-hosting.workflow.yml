# OPTIONAL, not installed. Manual `firebase deploy` (README → Deploy) is the source of truth.
# If you ever want a one-click deploy button in GitHub: copy to .github/workflows/firebase-hosting.yml
# (needs a token with the "workflow" scope) and add the FIREBASE_SERVICE_ACCOUNT_SPITOTHIKI secret.
# It runs only when started by hand (Actions → Run workflow); it never deploys on push.
name: Test and deploy to Firebase Hosting

# Without the secret the deploy step is skipped (tests still run).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPITOTHIKI != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPITOTHIKI }}
          projectId: spitothiki
          channelId: live
      - name: Deploy skipped
        if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT_SPITOTHIKI secret not set; skipping Firebase deploy."
