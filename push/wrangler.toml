name = "spitothiki-push"
account_id = "509f96807f1c43e201c2a56cc6d65683"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Push subscriptions: key = SHA-256(endpoint), value = { endpoint, dates[], lastSent }. Expire after 70 days unused.
[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "908a19e47cc44884b25dd51797fbf330"

# Every day 06:00 UTC = 09:00 Athens (summer) / 08:00 (winter).
[triggers]
crons = ["0 6 * * *"]

[vars]
VAPID_PUBLIC = "BIdTZDXO2Xq81aSHMGLX1znbzY3u1aH9MGKqG-IavVGpz2MyP8BQ8lbfAUulAQu_ZFJWN1slv4tj6xPKb4uesLg"
VAPID_SUBJECT = "mailto:spitothiki@users.noreply.github.com"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60
